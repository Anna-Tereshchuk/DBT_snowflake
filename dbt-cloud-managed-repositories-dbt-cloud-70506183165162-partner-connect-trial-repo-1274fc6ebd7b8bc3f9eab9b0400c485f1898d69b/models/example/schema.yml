version: 2

models:
  - name: stg_orders
    description: Order records prepared for analytics and reporting.

    columns:
      - name: order_id
        description: Unique identifier of an order.

        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Unique identifier of the customer who placed the order.

        data_tests:
          - not_null

      - name: order_status
        description: Current status of the order.

        data_tests:
          - accepted_values:
              arguments:
                values:
                  - placed
                  - shipped
                  - completed
                  - return_pending
                  - returned

  - name: stg_interviews
    description: Raw interview records cleaned and standardized for downstream analysis.

  - name: stg_interviews_latest
    description: Latest available interview record for each interview.

    columns:
      - name: candidate_id
        description: Unique identifier of a candidate.

        data_tests:
          - not_null

      - name: interviewer_id
        description: Unique identifier of the interviewer responsible for the interview.

        data_tests:
          - not_null
          - dbt_utils.not_constant

      - name: interview_status
        description: Current stage or outcome of the interview.

        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - DRAFT
                  - REQUESTED
                  - SCHEDULED
                  - IN_PROGRESS
                  - PENDING_FEEDBACK
                  - COMPLETED
                  - CANCELLED

  - name: dim_candidate
    description: "{{ doc('candidate_entity') }}"

    columns:
      - name: candidate_id
        description: Unique identifier of a candidate.

        data_tests:
          - unique
          - not_null

  - name: dim_interviewer
    description: "{{ doc('interviewer_entity') }}"

    columns:
      - name: interviewer_id
        description: Unique identifier of an interviewer.

        data_tests:
          - unique
          - not_null

  - name: fct_interview
    description: "{{ doc('interview_fact') }}"

    columns:
      - name: candidate_id
        description: Candidate participating in the interview process.

        data_tests:
          - relationships:
              arguments:
                to: ref('dim_candidate')
                field: candidate_id

      - name: interviewer_id
        description: Interviewer conducting the interview.

        data_tests:
          - relationships:
              arguments:
                to: ref('dim_interviewer')
                field: interviewer_id